[package]
name = "eh3d-design-verifier"
version = "0.0.3"
edition = "2021"
rust-version = "1.88"
description = "Integral verification of a design: gathers the results of the checks of the suite and reports what is confirmed apart from what is inconclusive"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-DESIGN-VERIFIER"
readme = "README.md"

[lib]
name = "eh3d_design_verifier"
path = "src/lib.rs"

[[bin]]
name = "eh3d-design-verifier"
path = "src/main.rs"

[dependencies]
# serde / serde_json: the database is plain JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# sha2: the digest of the data a report was made from
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
